name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar dependencias
        run: npm install
      - name: Criar projeto Android
        run: |
          npx cap add android
          npx cap sync android
      - name: Decodificar keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/baviera-release.jks
      - name: Compilar APK assinado
        if: env.KEYSTORE_BASE64 != ''
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          cat >> app/build.gradle << 'SIGN'

          android.signingConfigs {
              release {
                  storeFile file("baviera-release.jks")
                  storePassword "baviera2027"
                  keyAlias "baviera"
                  keyPassword "baviera2027"
              }
          }
          android.buildTypes.release.signingConfig = android.signingConfigs.release
          SIGN
          ./gradlew assembleRelease --no-daemon
      - name: Compilar APK debug (fallback)
        if: env.KEYSTORE_BASE64 == ''
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: ./gradlew assembleDebug --no-daemon
      - name: Renomear APK
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk baviera-2027.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk baviera-2027.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: baviera-2027-apk
          path: baviera-2027.apk
      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Baviera 2027
          body: Baixe baviera-2027.apk e instale no Android.
          files: baviera-2027.apk
          make_latest: true
