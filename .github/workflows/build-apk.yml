name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar dependencias
        run: npm install
      - name: Criar projeto Android
        run: |
          npx cap add android
          npx cap sync android
      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk natal-na-baviera.apk
      - uses: actions/upload-artifact@v4
        with:
          name: natal-na-baviera-apk
          path: natal-na-baviera.apk
      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Natal na Baviera (APK mais recente)
          body: Baixe o arquivo natal-na-baviera.apk e instale no Android.
          files: natal-na-baviera.apk
          make_latest: true
